services:
  # ===========================================
  # GAME SERVICES
  # ===========================================
  backend:
    image: ${GAME_NAME}-backend:latest
    container_name: ${GAME_NAME}-backend
    build:
      context: backend/
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    env_file:
      - ./backend/.env
      - ./backend/.env.secret
    environment:
      - LOG_LEVEL=INFO
      - GAME_NAME=${GAME_NAME}
      - GAME_PREFIX=${GAME_PREFIX}
      - POSTGRES__DSN=postgresql://${GAME_NAME}:${GAME_NAME}@backend-db:5432/${GAME_NAME}
    volumes:
      - ./backend/:/backend:rw
      - /backend/.venv
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    restart: always
    depends_on:
      backend-db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  backend-test:
    extends: backend
    container_name: ${GAME_NAME}-backend-test
    env_file:
      - ./backend/.test.env
    environment:
      - POSTGRES__DSN=postgresql://${GAME_NAME}:${GAME_NAME}@backend-db:5432/${GAME_NAME}_test
    depends_on:
      - backend-db
    profiles:
      - test

  backend-db:
    image: postgres:14
    container_name: ${GAME_NAME}-db
    restart: always
    environment:
      POSTGRES_USER: ${GAME_NAME}
      POSTGRES_PASSWORD: ${GAME_NAME}
      POSTGRES_DB: ${GAME_NAME}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${GAME_NAME}-db-data:/var/lib/postgresql/data
      - ./docker_assets/backend_db/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAME_NAME} -d ${GAME_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ${GAME_NAME}-db-data:
    name: ${GAME_NAME}-db-data
