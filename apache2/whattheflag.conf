# WhatTheFlag Apache Configuration (HTTP only, by IP)
# Usage:
#   sudo cp /var/projects/backend/apache2/whattheflag.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2ensite whattheflag.conf
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    
    # API proxy to backend
    ProxyPreserveHost On
    
    # WhatTheFlag API endpoints (/wtf/...)
    ProxyPass /wtf/ http://localhost:8002/wtf/
    ProxyPassReverse /wtf/ http://localhost:8002/wtf/
    
    # Telegram Webhook
    ProxyPass /telegram/ http://localhost:8002/telegram/
    ProxyPassReverse /telegram/ http://localhost:8002/telegram/
    
    # Health check
    ProxyPass /health http://localhost:8002/health
    ProxyPassReverse /health http://localhost:8002/health
    
    # Info
    ProxyPass /info http://localhost:8002/info
    ProxyPassReverse /info http://localhost:8002/info
    
    # Swagger docs (remove in production)
    ProxyPass /docs http://localhost:8002/docs
    ProxyPassReverse /docs http://localhost:8002/docs
    ProxyPass /openapi.json http://localhost:8002/openapi.json
    ProxyPassReverse /openapi.json http://localhost:8002/openapi.json
    
    # Disable caching for API
    <Location /wtf/>
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
        
        # CORS headers
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, X-Init-Data, X-Tg-Id, Authorization"
    </Location>
    
    <Location /telegram/>
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/whattheflag_error.log
    CustomLog ${APACHE_LOG_DIR}/whattheflag_access.log combined
</VirtualHost>
