# HTTP to HTTPS redirect for mergehero.fun
<VirtualHost *:80>
    ServerName mergehero.fun
    ServerAlias www.mergehero.fun
    
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS configuration for mergehero.fun
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName mergehero.fun
        ServerAlias www.mergehero.fun
        
        # SSL Configuration
        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/mergehero.fun/mergehero.crt
        SSLCertificateKeyFile /etc/letsencrypt/live/mergehero.fun/mergehero.key
        SSLCertificateChainFile /etc/letsencrypt/live/mergehero.fun/ca.crt
        
        # SSL Security Headers
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
        Header always set X-Content-Type-Options nosniff
        
        # Document root for MergeHero Telegram WebApp
        DocumentRoot /var/www/html/mergehero
        
        # API proxy to backend
        ProxyPreserveHost On
        
        # Backend API endpoints (prefix: MH)
        ProxyPass /MH/ http://localhost:8002/MH/
        ProxyPassReverse /MH/ http://localhost:8002/MH/
        
        # Telegram Webhook endpoint
        ProxyPass /telegram/ http://localhost:8002/telegram/
        ProxyPassReverse /telegram/ http://localhost:8002/telegram/
        
        # Health check
        ProxyPass /health http://localhost:8002/health
        ProxyPassReverse /health http://localhost:8002/health
        
        # Swagger docs (remove in production)
        ProxyPass /docs http://localhost:8002/docs
        ProxyPassReverse /docs http://localhost:8002/docs
        ProxyPass /openapi.json http://localhost:8002/openapi.json
        ProxyPassReverse /openapi.json http://localhost:8002/openapi.json
        
        # Disable caching for API endpoints
        <Location /MH/>
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </Location>
        
        <Location /telegram/>
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </Location>
        
        # Directory permissions and CORS settings
        <Directory /var/www/html/mergehero>
            Options Indexes FollowSymLinks
            AllowOverride None
            Require all granted
            DirectoryIndex index.html
            
            # CORS headers for Telegram WebApp
            Header set Access-Control-Allow-Origin "*"
            Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
            Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, X-Init-Data, X-Tg-Id"
            
            # Cross-Origin for SharedArrayBuffer (if used)
            Header set Cross-Origin-Embedder-Policy "require-corp"
            Header set Cross-Origin-Opener-Policy "same-origin"
            
            # X-Frame-Options for iframe in Telegram
            Header set X-Frame-Options "ALLOWALL"
            
            # MIME types for WebAssembly/Godot
            AddType application/wasm .wasm
            AddType application/octet-stream .pck
            AddType application/javascript .js
            
            # Cache static resources
            <FilesMatch "\.(wasm|pck|js|png|jpg|svg|ico|webp)$">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
            
            # Disable caching for HTML
            <FilesMatch "\.html$">
                Header set Cache-Control "no-cache, no-store, must-revalidate"
                Header set Pragma "no-cache"
                Header set Expires "0"
            </FilesMatch>
        </Directory>
        
        # Logging
        ErrorLog ${APACHE_LOG_DIR}/mergehero_fun_error.log
        CustomLog ${APACHE_LOG_DIR}/mergehero_fun_access.log combined
        
        # SSL Options
        <FilesMatch "\.(cgi|shtml|phtml|php)$">
            SSLOptions +StdEnvVars
        </FilesMatch>
        <Directory /usr/lib/cgi-bin>
            SSLOptions +StdEnvVars
        </Directory>
    </VirtualHost>
</IfModule>
