# Example Apache configuration for game server
# Replace GAME_DOMAIN with your actual domain
# Replace BACKEND_PORT with your backend port (default 8002)

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName mergehero.fun
    
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS configuration
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName mergehero.fun
        
        # SSL Configuration
        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/mergehero.fun/mergehero.crt
        SSLCertificateKeyFile /etc/letsencrypt/live/mergehero.fun/mergehero.key
        SSLCertificateChainFile /etc/letsencrypt/live/mergehero.fun/ca.crt
        
        # SSL Security Headers
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
        Header always set X-Content-Type-Options nosniff
        
        # Document root for static files (if any)
        DocumentRoot /var/www/html/merge_hero
        
        # API proxy to backend
        ProxyPreserveHost On
        
        # Backend API endpoints (replace GAME_PREFIX with your prefix, e.g., 'eg' or 'mh')
        ProxyPass /mh/ http://localhost:8002/mh/
        ProxyPassReverse /mh/ http://localhost:8002/mh/
        
        # Telegram Webhook endpoint
        ProxyPass /telegram/ http://localhost:8002/telegram/
        ProxyPassReverse /telegram/ http://localhost:8002/telegram/
        
        # Health check
        ProxyPass /health http://localhost:8002/health
        ProxyPassReverse /health http://localhost:8002/health

	# Nakama Console (HTTP gateway 7351)
        ProxyPass        /nakama-console/  http://127.0.0.1:7351/
        ProxyPassReverse /nakama-console/  http://127.0.0.1:7351/

        # info
        ProxyPass /info http://localhost:8002/info
        ProxyPassReverse /info http://localhost:8002/info
        
	# metrics 
        ProxyPass /metrics http://localhost:8002/metrics
        ProxyPassReverse /metrics http://localhost:8002/metrics
        

	# analytics 
        ProxyPass /analytics http://localhost:3000
        ProxyPassReverse /analytics http://localhost:3000

        # Swagger docs (remove in production)
        ProxyPass /docs http://localhost:8002/docs
        ProxyPassReverse /docs http://localhost:8002/docs
        ProxyPass /openapi.json http://localhost:8002/openapi.json
        ProxyPassReverse /openapi.json http://localhost:8002/openapi.json
        
        # Disable caching for API endpoints
        <Location /GAME_PREFIX/>
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </Location>
        
        <Location /telegram/>
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </Location>
        
        # Directory permissions
        <Directory /var/www/html/merge_hero>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
            DirectoryIndex index.html
            
            # CORS headers for Telegram WebApp
            Header set Access-Control-Allow-Origin "*"
            Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
            Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, X-Init-Data, X-Tg-Id"
            
            # Allow iframe in Telegram
            Header set X-Frame-Options "ALLOWALL"
        </Directory>
        
        # Logging
        ErrorLog ${APACHE_LOG_DIR}/merge_hero_error.log
        CustomLog ${APACHE_LOG_DIR}/merge_hero_access.log combined
    </VirtualHost>
</IfModule>

